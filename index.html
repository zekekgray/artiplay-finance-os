// and returns {id,label,pass,detail}. Consumed by generateAlerts() (INVARIANTS-ALERTS-93843401) and by
// the dedicated System Invariants page (INVARIANTS-PAGE-93843402). Add new rules here, not inline elsewhere.
function checkSystemInvariants(){
 const tol=1;
 const results=[];
 const push=(id,label,pass,detail)=>results.push({id,label,pass,detail});

 // 1. Recognized Revenue ≤ Contract Value
 let revViolations=[];
 db.deferred.forEach(d=>{if(moneyNum(d[6])>moneyNum(d[3])+tol)revViolations.push(d[0]);});
 push('rev-le-contract','Recognized Revenue ≤ Contract Value',revViolations.length===0,revViolations.length?`Package(s) over-recognized: ${revViolations.join(', ')}`:'All packages within contract value');

 // 2. Cash Received = Recognized Revenue + Remaining Deferred Revenue
 let defViolations=[];
 db.deferred.forEach(d=>{if(Math.abs(moneyNum(d[3])-(moneyNum(d[6])+moneyNum(d[7])))>=tol)defViolations.push(d[0]);});
 push('cash-eq-earned-plus-unearned','Cash Received = Recognized + Remaining Deferred',defViolations.length===0,defViolations.length?`Package(s) out of balance: ${defViolations.join(', ')}`:'All packages reconcile');

 // 3. 0 ≤ Consumed Sessions ≤ Total Sessions
 let sessionViolations=[];
 db.packages.forEach(p=>{const used=Number(p[5]),total=Number(p[4]);if(used<0||used>total)sessionViolations.push(p[0]);});
 push('sessions-bounded','0 ≤ Consumed Sessions ≤ Total Sessions',sessionViolations.length===0,sessionViolations.length?`Package(s) out of bounds: ${sessionViolations.join(', ')}`:'All packages within bounds');

 // 4. One attendance record per session
 const bySession={};
 db.attendance.forEach(a=>{bySession[a[1]]=(bySession[a[1]]||0)+1;});
 const dupSessions=Object.keys(bySession).filter(k=>bySession[k]>1);
 push('one-attendance-per-session','One Attendance Record per Session',dupSessions.length===0,dupSessions.length?`Session(s) with duplicate attendance: ${dupSessions.join(', ')}`:'No duplicates found');

 // 5. Paid + Balance = Invoice Total
 let invViolations=[];
 db.invoices.forEach(i=>{if(Math.abs((moneyNum(i[5])+moneyNum(i[6]))-moneyNum(i[4]))>=tol)invViolations.push(i[0]);});
 push('invoice-paid-plus-balance','Paid + Balance = Invoice Total',invViolations.length===0,invViolations.length?`Invoice(s) out of balance: ${invViolations.join(', ')}`:'All invoices reconcile');

 // 6. Verified payment → exactly one accounting event (approximate — matched by memo containing payment ID,
 // since journalEntries has no explicit sourceRef field yet)
 let payViolations=[];
 db.payments.filter(p=>p[6]==='Paid').forEach(p=>{
  const matches=(db.journalEntries||[]).filter(e=>e.status==='Posted'&&e.memo&&e.memo.includes(p[0])).length;
  if(matches!==1)payViolations.push(`${p[0]} (${matches} event${matches===1?'':'s'})`);
 });
 push('payment-one-event','Verified Payment → Exactly One Accounting Event',payViolations.length===0,payViolations.length?`Payment(s) with irregular event count: ${payViolations.join(', ')}`:'Every verified payment has exactly one posted event');

 // 7. Gross − Deductions = Net Pay
 let payrollViolations=[];
 (db.staffPayroll||[]).forEach(r=>{if(Math.abs((moneyNum(r[7])-moneyNum(r[8]))-moneyNum(r[9]))>=tol)payrollViolations.push(r[0]);});
 db.payroll.forEach(r=>{const gross=moneyNum(r[4])*Number(r[5]);if(Math.abs(gross-moneyNum(r[6]))>=tol)payrollViolations.push(r[0]);});
 push('payroll-gross-minus-deductions','Gross − Deductions = Net Pay',payrollViolations.length===0,payrollViolations.length?`Payroll record(s) mismatched: ${payrollViolations.join(', ')}`:'All payroll records reconcile');

 // 8. Trial Balance: Total Debits = Total Credits
 const tbRows=(db.coa||[]).filter(a=>a.status==='Active').map(a=>{const bal=coaBalance(a.code);return{debit:a.normal==='Debit'&&bal>0?bal:(a.normal==='Credit'&&bal<0?-bal:0),credit:a.normal==='Credit'&&bal>0?bal:(a.normal==='Debit'&&bal<0?-bal:0)};});
 const tbDebit=tbRows.reduce((s,r)=>s+r.debit,0),tbCredit=tbRows.reduce((s,r)=>s+r.credit,0);
 push('tb-debit-eq-credit','Trial Balance: Total Debits = Total Credits',Math.abs(tbDebit-tbCredit)<tol,`Debits ${money(tbDebit)} vs Credits ${money(tbCredit)}`);

 // 9. Balance Sheet: Assets = Liabilities + Equity
 const bs=bsGenerate(period);
 push('bs-assets-eq-liab-equity','Balance Sheet: Assets = Liabilities + Equity',bs.balanced,`Assets ${money(bs.totalAssets)} vs Liabilities+Equity ${money(bs.totalLiab+bs.totalEquity)}`);

 // 10. Cash Flow: Opening + Operating + Investing + Financing = Closing
 // NOTE: with the current cfGenerate(), 'financing' is computed as a residual (netChange - operating -
 // investing), so this equality holds by construction and will not catch a real divergence on its own.
 const cf=cfGenerate(period);
 const cfCheck=Math.abs((cf.openingCash+cf.operating+cf.investing+cf.financing)-cf.closingCash)<tol;
 push('cf-bridges-to-closing','Cash Flow: Opening + Operating + Investing + Financing = Closing',cfCheck,`Opening ${money(cf.openingCash)} + Operating ${money(cf.operating)} + Investing ${money(cf.investing)} + Financing ${money(cf.financing)} vs Closing ${money(cf.closingCash)}`);

 // v2: since CASHBOOK-LIVEGL-93843600, accounts[i][2] (Book) is now ALWAYS derived from the GL, so
 // Book-vs-GL is tautologically true and no longer a meaningful check. The real reconciliation
 // invariant now is Book (=GL) vs Cleared (=external bank statement) — i.e. cashVariance() per account.
 let reconViolations=[];
 db.accounts.forEach(a=>{if(Math.abs(moneyNum(a[2])-moneyNum(a[3]))>=tol)reconViolations.push(`${a[0]} (Book ${a[2]} vs Cleared ${a[3]})`);});

 /* /AFOS-PATCH id=INVARIANTS-RECON-V2-93843601 */

function nextStaffPayrollId(){return 'SPR-'+String((db.staffPayroll||[]).length+1).padStart(4,'0')}
function runStaffPayrollForPeriod(){
 if(!can('close')){toast('Not permitted for your role');return}
 const targets=activeStaff().filter(s=>!hasPayrollThisPeriod(s[0]));
 if(!targets.length){toast('Every active employee already has a payroll entry for this period');return}
 let created=0;
 targets.forEach(s=>{
  const rate=moneyNum(s[4]),allow=moneyNum(s[5]);
  let gross=rate+allow,unitLabel='1 (Monthly)';
  if(s[3]==='Daily'){const days=Number(prompt(`${s[1]} — days worked in ${periodLabel(period)}:`,'22'));if(!days){toast('Skipped '+s[1]+' — no days entered');return}gross=rate*days+allow;unitLabel=days+' day(s)';}
  else if(s[3]==='Hourly'){const hrs=Number(prompt(`${s[1]} — hours worked in ${periodLabel(period)}:`,'160'));if(!hrs){toast('Skipped '+s[1]+' — no hours entered');return}gross=rate*hrs+allow;unitLabel=hrs+' hr(s)';}
  const deduction=applyAdvanceDeductions(s[0],s[1],period,gross);
  const net=Math.max(0,gross-deduction.applied);
  const id=nextStaffPayrollId();
  db.staffPayroll=db.staffPayroll||[];db.staffPayroll.push([id,s[0],s[1],period,s[3],s[4],unitLabel,money(gross),money(deduction.applied),money(net),'Pending Approval','Unpaid']);
  deduction.entries.forEach(e=>e.payrollId=id);
  /* AFOS-PATCH id=STAFFPAYROLL-RUN-DRAFTJE-93841701 v1 */
  const draftJEId=postAutoJEDraft(today,`Staff payroll accrued (pending approval) — ${s[1]} (${id})`,[{account:'6410',debit:gross,credit:0},{account:'2200',debit:0,credit:net},{account:'1300',debit:0,credit:deduction.applied}].filter(l=>l.debit>0||l.credit>0));
  db.staffPayroll[db.staffPayroll.length-1][12]=draftJEId;
  /* /AFOS-PATCH id=STAFFPAYROLL-RUN-DRAFTJE-93841701 */
  db.audit.unshift([nowStr(),role,'Staff Payroll',id,`Run for ${s[1]} — gross ${money(gross)}, deductions ${money(deduction.applied)}, net ${money(net)} — JE ${draftJEId} created as Draft (posts on approval)`]);
  created++;
 });
 save();go('Staff Payroll');toast(created?`Payroll run — ${created} employee(s) pending approval`:'No payroll entries created');
}
function applyAdvanceDeductions(staffId,staffName,periodKey,grossPay){
 const active=(db.advances||[]).filter(a=>a.staffId===staffId&&a.status==='Active');
 let applied=0;const entries=[];
 active.forEach(a=>{
  const amt=Math.min(a.monthlyAmount,a.remainingBalance,Math.max(0,grossPay-applied));
  if(amt<=0)return;
  a.remainingBalance=Math.round((a.remainingBalance-amt)*100)/100;
  a.appliedLog.push({period:periodKey,amount:amt,payrollId:null});
  entries.push(a.appliedLog[a.appliedLog.length-1]);
  applied+=amt;
  if(a.remainingBalance<=0){a.status='Completed';db.audit.unshift([nowStr(),role,'Advance',a.id,`Fully repaid by ${staffName} — closed`]);}
 });
 return {applied,entries};
}

function studentLedger(pid){

function receiveStock(sku){
 if(!can('editRecords')){toast('Not permitted for your role');return}

 if(periodLocked(period)){toast(`${periodLabel(period)} is locked — reopen the period to edit.`);return}

 const ref=prompt('Reference (PO / supplier / receipt):')||'—';

 const oldQty=Number(item[3]);
 const oldCost=moneyNum(item[4]);

 const newCost=newQty>0?((oldQty*oldCost)+(qty*unitCost))/newQty:unitCost;
 item[3]=String(newQty);item[4]=money(Math.round(newCost));
 const value=qty*unitCost;
 if(value>0)postAutoJE(today,`Inventory received — ${item[1]} (${ref})`,[{account:'1200',debit:value,credit:0},{account:'2000',debit:0,credit:value}]);
 recordStockMovement(sku,'Receive',qty,unitCost,ref,note||'Received into stock');

 logAudit({what:'Inventory received',reference:sku,before:`${oldQty} units`,after:`${newQty} units`,source:'Inventory'});
 save();go('Inventory');toast(`Received ${qty} × ${item[1]} — new balance ${newQty}`);
}

function currentActiveEnrollment(){return db.players.filter(p=>p[3]==='Active').length;}
function currentBaselineExpense(){return budgetActualExpense(period)||db.expenses.reduce((s,x)=>s+moneyNum(x.amount),0)+db.payroll.reduce((s,x)=>s+moneyNum(x[6]),0);}
function runForecastEngine(assump){
 const rows=[];
 let enroll=currentActiveEnrollment();
 let expense=currentBaselineExpense();
 let cash=db.accounts.reduce((s,a)=>s+moneyNum(a[3]),0);
 let basePeriod=period;
 for(let i=1;i<=assump.horizonMonths;i++){
  const [y,m]=basePeriod.split('-').map(Number);
  const d=new Date(y,m-1+i,1);
  const label=d.toLocaleString('en-US',{month:'short',year:'numeric'});
  const netGrowthPct=(assump.monthlyEnrollGrowth-assump.monthlyChurn)/100;
  enroll=Math.max(0,Math.round(enroll*(1+netGrowthPct)));
  const revenue=Math.round(enroll*assump.avgPackageValue/ (assump.horizonMonths>=1?3:1));
  expense=Math.round(expense*(1+assump.expenseGrowth/100));
  const net=revenue-expense;
  cash=cash+net;
  rows.push({label,enroll,revenue,expense,net,cash});
 }
 return rows;
}

function createJournalEntry(){

 while(true){

  const debit=Number(prompt('Debit amount (0 if none):','0'))||0;
  const credit=Number(prompt('Credit amount (0 if none):','0'))||0;
  if(debit===0&&credit===0){toast('Line skipped — no amount entered');continue}
  lines.push({account:code,debit,credit});
 }
 if(lines.length<2){toast('Need at least 2 lines for a journal entry');return}
 const totalDebit=lines.reduce((s,l)=>s+l.debit,0),totalCredit=lines.reduce((s,l)=>s+l.credit,0);
 const balanced=totalDebit===totalCredit;
 const id=nextJEId();
 db.journalEntries=db.journalEntries||[];db.journalEntries.push({id,date:today,memo,status:'Draft',lines,postedBy:null,postedAt:null,reversalOf:null,reversedBy:null,createdBy:role,createdAt:nowStr(),balanced});
 db.audit.unshift([nowStr(),role,'Journal',id,`Created — ${lines.length} line(s), Dr ${money(totalDebit)} / Cr ${money(totalCredit)}${balanced?'':' — UNBALANCED'}`]);

function postJournalEntry(id){

 if(td!==tc){toast(`Cannot post — not balanced (Dr ${money(td)} ≠ Cr ${money(tc)})`);return}
 e.status='Posted';e.postedBy=role;e.postedAt=nowStr();
 db.audit.unshift([nowStr(),role,'Journal',id,`Posted — Dr ${money(td)} / Cr ${money(tc)}`]);

 const je=postAutoJE(today,`Expense paid — ${exp.description} (${id})`,[{account:'2000',debit:exp.amount,credit:0},{account:acctCode,debit:0,credit:exp.amount}]);
 db.journal.push([today,id,`Expense paid — ${exp.description}`,'Debit Accounts Payable / Credit Cash',money(exp.amount)]);
 db.audit.unshift([nowStr(),role,'Expense',id,`Paid ${money(exp.amount)} from ${exp.account} (${je})`]);
 logAudit({what:'Expense paid',reference:id,before:'Approved / Uncleared',after:`Paid ${money(exp.amount)} from ${exp.account} — ${je}`,source:'Expenses'});
 save();go('Expenses');toast(`${id} paid from ${exp.account}`);
}

/* AFOS-PATCH id=FORM-ENGINE-93845200 v1 */
// Generic validated modal-form engine — replaces chained prompt()/confirm() calls across the app.
// Usage: openFormModal({title, subtitle, submitLabel, fields:[{id,label,type,required,value,options,
// hint,min,step,placeholder,validate(v,allValues),onChangeAttr}], confirmMessage, onSubmit(values)}).
// - type: 'text' (default) | 'number' | 'date' | 'select' | 'textarea' | 'checkbox'
// - options for select: array of strings, or {value,label} objects
// - validate: return an error string to block submit, or null/undefined if OK
// - onChangeAttr: raw onchange="" JS string for select fields that need to trigger a dependent
//   field's options to refresh (see _refreshSessionPackageOptions for a working example)
// - confirmMessage: string or fn(values)->string; if set, shows a confirm() before onSubmit runs
// Every converted flow keeps calling save() + db.audit.unshift(...) exactly as before inside onSubmit —
// this engine only replaces the INPUT COLLECTION step, not the transaction/audit step.
let _activeFormModal=null;
function openFormModal(opts){
 opts=opts||{};
 const fields=opts.fields||[];
 const rows=fields.map(f=>{
  const val=f.value!==undefined?f.value:'';
  const span=f.span2?'span2':(f.span3?'span3':'');
  let input='';
  if(f.type==='select'){
   const opts2=(f.options||[]).map(o=>{const ov=typeof o==='object'?o.value:o;const ol=typeof o==='object'?o.label:o;return `<option value="${String(ov).replace(/"/g,'&quot;')}" ${String(val)===String(ov)?'selected':''}>${ol}</option>`}).join('');
   input=`<select id="ff_${f.id}" ${f.onChangeAttr?`onchange="${f.onChangeAttr}"`:''}>${opts2}</select>`;
  }else if(f.type==='textarea'){
   input=`<textarea id="ff_${f.id}" rows="${f.rows||3}" placeholder="${f.placeholder||''}">${val}</textarea>`;
  }else if(f.type==='checkbox'){
   input=`<div class="listrow" style="padding:6px 0"><span>${f.checkboxLabel||f.label}</span><input type="checkbox" id="ff_${f.id}" ${val?'checked':''}></div>`;
  }else{
   input=`<input type="${f.type||'text'}" id="ff_${f.id}" value="${val}" placeholder="${f.placeholder||''}" ${f.min!==undefined?'min="'+f.min+'"':''} ${f.step!==undefined?'step="'+f.step+'"':''}>`;
  }
  const showLabel=f.type==='checkbox'?'':`<label>${f.label}${f.required?' *':''}</label>`;
  return `<div class="field ${span}">${showLabel}${input}${f.hint?`<div class="mut" style="font-size:11px;margin-top:3px">${f.hint}</div>`:''}<div id="fferr_${f.id}" class="bad" style="font-size:11px;margin-top:3px;display:none"></div></div>`;
 }).join('');
 document.getElementById('modal').innerHTML=`
 <div class="modalhead"><div><h2>${opts.title||'Form'}</h2>${opts.subtitle?`<p class="mut">${opts.subtitle}</p>`:''}</div><button class="close" onclick="closeModal()">×</button></div>
 <div class="formgrid">${rows}</div>
 <div class="actions" style="margin-top:18px;justify-content:flex-end"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="_submitFormModal()">${opts.submitLabel||'Save'}</button></div>`;
 document.getElementById('modalback').classList.add('open');
 _activeFormModal={fields,onSubmit:opts.onSubmit,confirmMessage:opts.confirmMessage};
}
function _readFormValue(f){
 const el=document.getElementById('ff_'+f.id);if(!el)return undefined;
 if(f.type==='checkbox')return el.checked;
 if(f.type==='number')return el.value===''?undefined:Number(el.value);
 return el.value.trim();
}
function _submitFormModal(){
 const ctx=_activeFormModal;if(!ctx)return;
 const values={};let firstError=null;
 ctx.fields.forEach(f=>{
  const errEl=document.getElementById('fferr_'+f.id);if(errEl)errEl.style.display='none';
  const v=_readFormValue(f);values[f.id]=v;
  let err=null;
  if(f.required&&(v===undefined||v===''||(f.type==='number'&&isNaN(v))))err='Required';
  else if(f.type==='number'&&v!==undefined&&v!==''&&isNaN(v))err='Must be a number';
  if(!err&&f.validate){const r=f.validate(v,values);if(r)err=r;}
  if(err&&errEl){errEl.textContent=err;errEl.style.display='block';if(!firstError)firstError=f.id;}
 });
 if(firstError){toast('Please fix the highlighted field(s)');return}
 if(ctx.confirmMessage){const msg=typeof ctx.confirmMessage==='function'?ctx.confirmMessage(values):ctx.confirmMessage;if(!confirm(msg))return}
 try{ctx.onSubmit(values);}catch(e){toast('Error: '+(e&&e.message?e.message:'could not save'));}
}
